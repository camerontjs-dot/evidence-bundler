[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-bundler"
version = "0.1.0"
description = "Prepare traceable evidence bundles from scaffolded research corpora."
readme = "README.md"
requires-python = ">=3.11,<3.13"
keywords = ["evidence", "provenance", "audit", "cli", "traceability"]
authors = [
    { name = "Cameron Sanderson" },
]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing",
]
dependencies = [
    "click>=8.1,<9",
    "pdfminer.six>=20231228,<20270000",
    "pydantic>=2.6,<3",
    "pypdf>=4.0,<7",
    "PyYAML>=6.0,<7",
    "rank-bm25>=0.2.2,<0.3",
    "faiss-cpu>=1.13,<2",
    "sentence-transformers>=3.0,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.15,<1",
    "types-PyYAML>=6.0,<7",
    "mypy>=1.20,<2",
]


[project.scripts]
evidence-bundler = "evidence_bundler.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
