      - name: Validate and combine fresh claims
        run: |
          set -euo pipefail
          mkdir -p out/claims
          python study/$SURFACE/apparatus.py combine-claims \
            --parts out/claims/C1.json out/claims/C2.json out/claims/C3.json out/claims/C4.json out/claims/C5.json out/claims/C6.json \
            --out out/CLAIMS.json

      - name: Freeze claims before descriptor derivation
        run: |
          set -euo pipefail
          git -C study config user.name "github-actions[bot]"
          git -C study config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C study checkout -b "$CLAIMS_BRANCH"
          dest=study/$SURFACE/fresh_authoring
          mkdir -p "$dest"
          cp out/CLAIMS.json "$dest/CLAIMS.json"
          cat > "$dest/CLAIMS-FREEZE-RECEIPT.json" <<EOF
          {
            "schema": "eb-composite-obligation-rc1-claims-freeze",
            "bootstrap_head": "$(git -C study rev-parse HEAD)",
            "claims_file_sha256": "$(sha256sum out/CLAIMS.json | awk '{print $1}')",
            "corpus_authored": false,
            "target_revealed": false
          }
          EOF
          git -C study add "$SURFACE/fresh_authoring/CLAIMS.json" "$SURFACE/fresh_authoring/CLAIMS-FREEZE-RECEIPT.json"
          git -C study commit -m "Research: freeze fresh RC1 claims before corpus"
          git -C study push origin "HEAD:refs/heads/$CLAIMS_BRANCH"
          echo "CLAIMS_COMMIT=$(git -C study rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Checkout exact Claim Profile authority after claims freeze
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/proposition-authoring
          ref: e29a165b682d060f5dc2a0f3c7d64a7f29b172b4
          path: proposition-authoring
          fetch-depth: 1

      - name: Derive and freeze expected evidence forms
        run: |
          set -euo pipefail
          test "$(git -C proposition-authoring rev-parse HEAD)" = "$PROP_REF"
          python -m pip install ./proposition-authoring
          python study/$SURFACE/apparatus.py derive-descriptors \
            --claims out/CLAIMS.json \
            --out out/CLAIMS-AND-DESCRIPTORS.json
          python study/$SURFACE/apparatus.py split-categories \
            --input out/CLAIMS-AND-DESCRIPTORS.json \
            --out-dir out/descriptor-parts
          git -C study checkout -b "$DESCRIPTORS_BRANCH"
          dest=study/$SURFACE/fresh_authoring
          cp out/CLAIMS-AND-DESCRIPTORS.json "$dest/CLAIMS-AND-DESCRIPTORS.json"
          cat > "$dest/DESCRIPTORS-FREEZE-RECEIPT.json" <<EOF
          {
            "schema": "eb-composite-obligation-rc1-descriptors-freeze",
            "claims_commit": "$CLAIMS_COMMIT",
            "claim_profile_authority": "$PROP_REF",
            "descriptors_file_sha256": "$(sha256sum out/CLAIMS-AND-DESCRIPTORS.json | awk '{print $1}')",
            "corpus_authored": false,
            "target_revealed": false
          }
          EOF
          git -C study add "$SURFACE/fresh_authoring/CLAIMS-AND-DESCRIPTORS.json" "$SURFACE/fresh_authoring/DESCRIPTORS-FREEZE-RECEIPT.json"
          git -C study commit -m "Research: freeze fresh RC1 obligation descriptors"
          git -C study push origin "HEAD:refs/heads/$DESCRIPTORS_BRANCH"
