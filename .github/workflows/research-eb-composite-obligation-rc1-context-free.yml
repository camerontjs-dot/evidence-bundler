name: Research - EB Composite Obligation RC1 Context-Free Authoring

on:
  push:
    branches:
      - research-infra/eb-composite-obligation-rc1-context-free-bootstrap-20260918
    paths:
      - research/eb_composite_obligation_rc1_context_free/LAUNCH.json

permissions:
  contents: write
  copilot-requests: write

env:
  SURFACE: research/eb_composite_obligation_rc1_context_free
  PROP_REF: e29a165b682d060f5dc2a0f3c7d64a7f29b172b4
  CLAIMS_BRANCH: research/eb-composite-obligation-rc1-claims-freeze-${{ github.run_id }}
  DESCRIPTORS_BRANCH: research/eb-composite-obligation-rc1-descriptors-freeze-${{ github.run_id }}
  CORPUS_BRANCH: research/eb-composite-obligation-rc1-corpus-freeze-${{ github.run_id }}
  FRESH_BASE_BRANCH: research/eb-composite-obligation-rc1-fresh-input-base-${{ github.run_id }}
  FRESH_FINAL_BRANCH: research/eb-composite-obligation-rc1-fresh-input-final-20260918
  GOLD_BRANCH: research/eb-composite-obligation-rc1-sealed-gold-final-20260918
  TOKENIZERS_PARALLELISM: "false"

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated bootstrap only
        uses: actions/checkout@v4
        with:
          path: study
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install isolated Copilot CLI transport
        run: |
          set -euo pipefail
          npm install -g @github/copilot
          python -m pip install PyYAML
          copilot --version

      - name: Bootstrap static gates and source-access declaration
        run: |
          set -euo pipefail
          mkdir -p out
          python -m pip install 'ruff>=0.15,<1'
          python -m ruff check study/$SURFACE/apparatus.py study/$SURFACE/evaluator.py study/$SURFACE/copilot_isolation.py
          python -m py_compile study/$SURFACE/apparatus.py study/$SURFACE/evaluator.py study/$SURFACE/copilot_isolation.py
          cat > out/SOURCE-ACCESS.json <<EOF
          {
            "schema": "eb-composite-obligation-rc1-source-access",
            "bootstrap_head": "$(git -C study rev-parse HEAD)",
            "allowed_repository_reads": [
              "bootstrap files rendered explicitly into Copilot CLI prompts",
              "proposition-authoring@$PROP_REF after claim freeze"
            ],
            "isolation_provider": "GitHub Copilot CLI with Actions GITHUB_TOKEN",
            "isolation_model": "gpt-5.4",
            "copilot_builtin_mcp_disabled": true,
            "copilot_tool_policy": "read,shell,write,url,memory denied",
            "normal_conversation_context_available": false,
            "target_bytes_available_prereveal": false,
            "development_results_available_prereveal": false
          }
          EOF


      - name: Author C1 fresh claims
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/claims out/prompts isolation/claims-C1
          prompt="out/prompts/claims-C1.txt"
          python study/$SURFACE/copilot_isolation.py render \
            --prompt study/$SURFACE/AUTHOR-CLAIMS.prompt.yml \
            --var category_id=C1 \
            --file-var contract=study/$SURFACE/FRESH-COHORT-CONTRACT.md \
            --out "$prompt"
          iso="$GITHUB_WORKSPACE/isolation/claims-C1"
          home="$RUNNER_TEMP/copilot-home-claims-C1"
          mkdir -p "$home"
          printf '{"trustedFolders":["%s"]}\n' "$iso" > "$home/config.json"
          (
            cd "$iso"
            COPILOT_HOME="$home" copilot \
              -p "$(cat "$GITHUB_WORKSPACE/$prompt")" \
              -s \
              --no-ask-user \
              --no-auto-update \
              --disable-builtin-mcps \
              --disallow-temp-dir \
              --model gpt-5.4 \
              --deny-tool='read,shell,write,url,memory' \
              > "$GITHUB_WORKSPACE/out/claims/C1.raw.txt"
          )
          python study/$SURFACE/copilot_isolation.py extract-json \
            --raw out/claims/C1.raw.txt \
            --out out/claims/C1.json

      - name: Author C2 fresh claims
