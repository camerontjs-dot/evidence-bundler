name: Research - EB retrieval assurance RC2 sealed discrimination

on:
  push:
    branches:
      - research-infra/eb-retrieval-assurance-rc2
    paths:
      - 'research/eb_retrieval_assurance_rc2/**'
      - 'docs/research/brief-13-eb-retrieval-assurance-rc2.md'
      - 'docs/research/deviation-13a-presealed-generator-seed-noop.md'
      - 'benchmarks/eb-retrieval-assurance-rc2-v1/**'
      - '.github/workflows/research-eb-retrieval-assurance-rc2.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'research/eb_retrieval_assurance_rc2/**'
      - 'docs/research/brief-13-eb-retrieval-assurance-rc2.md'
      - 'docs/research/deviation-13a-presealed-generator-seed-noop.md'
      - 'benchmarks/eb-retrieval-assurance-rc2-v1/**'
      - '.github/workflows/research-eb-retrieval-assurance-rc2.yml'

permissions:
  contents: read

jobs:
  sealed-discrimination:
    runs-on: ubuntu-latest
    env:
      APPARATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      APPARATUS_ROOT: research/eb_retrieval_assurance_rc2
      OUT: artifacts/eb-retrieval-assurance-rc2
    steps:
      - name: Checkout exact RC2 apparatus
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify research-only diff and frozen predecessor boundaries
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^src/|^pyproject\.toml$|^requirements'; then
            echo 'RC2 must not change production runtime or dependencies' >&2
            exit 1
          fi
          test -f docs/research/brief-13-eb-retrieval-assurance-rc2.md
          test -f docs/research/deviation-13a-presealed-generator-seed-noop.md
          test -f "$APPARATUS_ROOT/generate_challenge.py"
          test -f "$APPARATUS_ROOT/validate_challenge.py"
          test -f "$APPARATUS_ROOT/evaluator.py"
          test -f "$APPARATUS_ROOT/control_runner.py"
          test -f "$APPARATUS_ROOT/thresholds.json"
          test -f "$APPARATUS_ROOT/result.schema.json"

      - name: Record pre-sealed apparatus identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          sha256sum \
            "$APPARATUS_ROOT/generate_challenge.py" \
            "$APPARATUS_ROOT/validate_challenge.py" \
            "$APPARATUS_ROOT/evaluator.py" \
            "$APPARATUS_ROOT/control_runner.py" \
            "$APPARATUS_ROOT/thresholds.json" \
            "$APPARATUS_ROOT/result.schema.json" \
            docs/research/brief-13-eb-retrieval-assurance-rc2.md \
            docs/research/deviation-13a-presealed-generator-seed-noop.md \
            | tee "$OUT/apparatus-sha256.txt"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          files = [
              'research/eb_retrieval_assurance_rc2/generate_challenge.py',
              'research/eb_retrieval_assurance_rc2/validate_challenge.py',
              'research/eb_retrieval_assurance_rc2/evaluator.py',
              'research/eb_retrieval_assurance_rc2/control_runner.py',
              'research/eb_retrieval_assurance_rc2/thresholds.json',
              'research/eb_retrieval_assurance_rc2/result.schema.json',
              'docs/research/brief-13-eb-retrieval-assurance-rc2.md',
              'docs/research/deviation-13a-presealed-generator-seed-noop.md',
          ]
          h=hashlib.sha256()
          identities={}
          for name in files:
              data=Path(name).read_bytes()
              digest=hashlib.sha256(data).hexdigest()
              identities[name]=digest
              h.update(name.encode()); h.update(b'\0'); h.update(data); h.update(b'\0')
          payload={
              'schema_version':'1.0',
              'apparatus_commit':os.environ['APPARATUS_SHA'],
              'files':identities,
              'composite_sha256':h.hexdigest(),
              'real_eb_executed':False,
          }
          Path(os.environ['OUT'],'apparatus-identity.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY

      - name: Development gate on exact hosted bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/dev
          python "$APPARATUS_ROOT/generate_challenge.py" \
            --output work/dev --splits dev \
            --generator-source-commit "$APPARATUS_SHA" \
            > "$OUT/dev-generation.json"
          python "$APPARATUS_ROOT/validate_challenge.py" \
            --benchmark-root work/dev \
            --output "$OUT/dev-validation.json"
          PYTHONPATH="$APPARATUS_ROOT" python "$APPARATUS_ROOT/control_runner.py" \
            --benchmark-root work/dev --split dev \
            --thresholds "$APPARATUS_ROOT/thresholds.json" \
            --output "$OUT/dev-controls.json"

      - name: First hosted sealed challenge generation
        id: sealed_generation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e work/candidate
          python "$APPARATUS_ROOT/generate_challenge.py" \
            --output work/candidate --splits all \
            --generator-source-commit "$APPARATUS_SHA" \
            > "$OUT/first-sealed-generation.json"
          cp work/candidate/freeze_receipt.json "$OUT/candidate-freeze-receipt.json"
          cp work/candidate/manifest.json "$OUT/candidate-manifest.json"
          python "$APPARATUS_ROOT/validate_challenge.py" \
            --benchmark-root work/candidate \
            --output "$OUT/candidate-validation.json"

      - name: FIRST hosted sealed control gate
        id: first_sealed_gate
        shell: bash
        run: |
          set -uo pipefail
          set +e
          PYTHONPATH="$APPARATUS_ROOT" python "$APPARATUS_ROOT/control_runner.py" \
            --benchmark-root work/candidate --split sealed \
            --thresholds "$APPARATUS_ROOT/thresholds.json" \
            --output "$OUT/sealed-controls-FIRST.json" \
            > "$OUT/sealed-controls-FIRST.log" 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test -f "$OUT/sealed-controls-FIRST.json"
          cat "$OUT/sealed-controls-FIRST.log"

      - name: Deterministic regeneration and byte comparison
        if: always() && steps.sealed_generation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/replay
          python "$APPARATUS_ROOT/generate_challenge.py" \
            --output work/replay --splits all \
            --generator-source-commit "$APPARATUS_SHA" \
            > "$OUT/replay-generation.json"
          diff -qr work/candidate work/replay | tee "$OUT/replay-diff.txt"
          test ! -s "$OUT/replay-diff.txt"
          find work/candidate -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/candidate-file-sha256.txt"
          find work/replay -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/replay-file-sha256.txt"

      - name: Write immutable first-sealed receipt
        if: always() && steps.sealed_generation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out=Path(os.environ['OUT'])
          def digest(name):
              p=out/name
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
          gate=None
          if (out/'sealed-controls-FIRST.json').exists():
              gate=json.loads((out/'sealed-controls-FIRST.json').read_text())
          receipt={
              'schema_version':'1.0',
              'apparatus_commit':os.environ['APPARATUS_SHA'],
              'candidate_freeze_receipt':json.loads((out/'candidate-freeze-receipt.json').read_text()),
              'first_sealed_control_sha256':digest('sealed-controls-FIRST.json'),
              'candidate_validation_sha256':digest('candidate-validation.json'),
              'apparatus_identity_sha256':digest('apparatus-identity.json'),
              'first_sealed_gate_pass':gate.get('gate_pass') if gate else False,
              'real_eb_executed':False,
              'sealed_runtime_exposed_to_eb':False,
          }
          (out/'first-sealed-run-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum "$OUT"/* | tee "$OUT/artifact-sha256.txt"

      - name: Upload RC2 first-sealed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eb-retrieval-assurance-rc2-${{ github.run_id }}
          path: |
            artifacts/eb-retrieval-assurance-rc2
            work/candidate
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce first sealed decision gate
        if: always() && steps.sealed_generation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          status='${{ steps.first_sealed_gate.outputs.status }}'
          if [[ "$status" != "0" ]]; then
            echo "First hosted sealed RC2 discrimination gate failed with status $status." >&2
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path(os.environ['OUT'],'sealed-controls-FIRST.json').read_text())
          if data.get('gate_pass') is not True:
              raise SystemExit('first sealed gate_pass is not true')
          PY
