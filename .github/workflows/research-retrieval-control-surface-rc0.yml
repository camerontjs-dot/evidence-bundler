name: Research - retrieval control surface RC0

on:
  pull_request:
    paths:
      - "src/evidence_bundler/**"
      - "tests/**"
      - "research/retrieval_control_surface_rc0/**"
      - ".github/workflows/research-retrieval-control-surface-rc0.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-control-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Run full deterministic suite
        run: |
          mkdir -p artifacts/retrieval-control-surface-rc0
          {
            echo "commit=$(git rev-parse HEAD)"
            python -m pytest -q
          } 2>&1 | tee artifacts/retrieval-control-surface-rc0/pytest.txt
      - name: Run RC0 mutation tests explicitly
        run: |
          python -m pytest -q tests/test_retrieval_control_surface_rc0.py             2>&1 | tee artifacts/retrieval-control-surface-rc0/mutation-tests.txt
      - name: Ruff touched machinery
        run: |
          python -m ruff check             src/evidence_bundler/models/retrieval.py             src/evidence_bundler/retrieval/embedding_retriever.py             src/evidence_bundler/retrieval/reranker.py             src/evidence_bundler/contracts/writer.py             src/evidence_bundler/cli.py             tests/test_retrieval_control_surface_rc0.py             tests/test_bundle_writer.py             research/retrieval_control_surface_rc0/real_model_smoke.py             2>&1 | tee artifacts/retrieval-control-surface-rc0/ruff.txt
      - name: Mypy RC0-touched source
        run: |
          python -m mypy             src/evidence_bundler/models/retrieval.py             src/evidence_bundler/retrieval/embedding_retriever.py             src/evidence_bundler/retrieval/reranker.py             src/evidence_bundler/contracts/writer.py             src/evidence_bundler/cli.py             2>&1 | tee artifacts/retrieval-control-surface-rc0/mypy.txt
      - name: CLI truthfulness receipt
        run: |
          evidence-bundler build-bundle --help             | tee artifacts/retrieval-control-surface-rc0/build-bundle-help.txt
          ! grep -q "not wired" artifacts/retrieval-control-surface-rc0/build-bundle-help.txt
          grep -q "semantic" artifacts/retrieval-control-surface-rc0/build-bundle-help.txt
          grep -q "hybrid" artifacts/retrieval-control-surface-rc0/build-bundle-help.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-control-surface-rc0-deterministic-${{ github.sha }}
          path: artifacts/retrieval-control-surface-rc0/
          if-no-files-found: warn
          retention-days: 30

  real-model-pinning-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Execute pinned real models on synthetic inputs
        run: |
          mkdir -p artifacts/retrieval-control-surface-rc0-real-model
          python research/retrieval_control_surface_rc0/real_model_smoke.py             | tee artifacts/retrieval-control-surface-rc0-real-model/receipt.json
          sha256sum artifacts/retrieval-control-surface-rc0-real-model/receipt.json             > artifacts/retrieval-control-surface-rc0-real-model/receipt.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-control-surface-rc0-real-model-${{ github.sha }}
          path: artifacts/retrieval-control-surface-rc0-real-model/
          if-no-files-found: warn
          retention-days: 30
