name: Research - retrieval control surface RC0 bootstrap

on:
  push:
    branches:
      - research/retrieval-control-surface-rc0-20260829
    paths:
      - "research/retrieval_control_surface_rc0/apply_rc0.py"
      - "research/retrieval_control_surface_rc0/apply_rc0_followup.py"
      - ".github/workflows/research-retrieval-control-surface-rc0-bootstrap.yml"

permissions:
  contents: write

jobs:
  apply-test-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/retrieval-control-surface-rc0-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify preregistration ancestry
        run: |
          git merge-base --is-ancestor 49e61842fc662b121ce3ff95cdedaa1f8e869aaf HEAD
          test "$(git rev-list --max-parents=0 HEAD)" != ""
      - name: Apply asserted RC0 patch
        run: |
          python research/retrieval_control_surface_rc0/apply_rc0.py
          python research/retrieval_control_surface_rc0/apply_rc0_followup.py
      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Run full pytest suite before freeze
        run: python -m pytest -q
      - name: Run touched-file Ruff before freeze
        run: |
          python -m ruff check \
            src/evidence_bundler/models/retrieval.py \
            src/evidence_bundler/retrieval/embedding_retriever.py \
            src/evidence_bundler/retrieval/reranker.py \
            src/evidence_bundler/contracts/writer.py \
            src/evidence_bundler/cli.py \
            tests/test_retrieval_control_surface_rc0.py \
            tests/test_bundle_writer.py \
            tests/test_cli.py \
            research/retrieval_control_surface_rc0/real_model_smoke.py
      - name: Run mypy before freeze
        run: python -m mypy src
      - name: Verify CLI help before freeze
        run: |
          evidence-bundler build-bundle --help > /tmp/build-bundle-help.txt
          ! grep -q "not wired" /tmp/build-bundle-help.txt
          grep -q "semantic" /tmp/build-bundle-help.txt
          grep -q "hybrid" /tmp/build-bundle-help.txt
      - name: Remove temporary patch/bootstrap machinery
        run: |
          rm research/retrieval_control_surface_rc0/apply_rc0.py
          rm research/retrieval_control_surface_rc0/apply_rc0_followup.py
          rm .github/workflows/research-retrieval-control-surface-rc0-bootstrap.yml
      - name: Freeze implementation commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "research-infra: harden retrieval control surface RC0"
          git push origin HEAD:research/retrieval-control-surface-rc0-20260829
