name: Research - EB Typed Selector Operational Screen RC0

on:
  pull_request:
    paths:
      - "research/eb_typed_selector_rc0/**"
      - ".github/workflows/research-eb-typed-selector-operational-screen-rc0.yml"

permissions:
  contents: read
  actions: read

jobs:
  operational-pool-development:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact previously exercised semantic runtime
        run: |
          python -m pip install \
            'torch==2.14.0' \
            'transformers==5.17.0' \
            'tokenizers==0.23.2' \
            'huggingface-hub==1.31.0'

      - name: Stage frozen candidate world and non-label relation map
        run: |
          set -euo pipefail
          mkdir -p work/sealed_eval
          gh api repos/camerontjs-dot/evidence-bundler/actions/artifacts/10282804289/zip > work/pr63.zip
          echo '3424e70988a2ca878e97f6eeaf855cd5ebbd449413536841872bd485de74819d  work/pr63.zip' | sha256sum -c -
          git fetch --quiet --depth=1 origin e84cfd84826eacb9751ecf4b54ff9c369547df58
          git fetch --quiet --depth=1 origin eb72be8f936d68cf2cfcb316e401626ea9de5839
          git show e84cfd84826eacb9751ecf4b54ff9c369547df58:research/eb_v1_operational_burden_rc1/SUPERVISOR_RELATION_MAP.json > work/RELATION_MAP.json

      - name: Score all 96 relationships before opening operational labels
        run: |
          set -euo pipefail
          python research/eb_typed_selector_rc0/screen_operational_pool.py \
            --artifact-zip work/pr63.zip \
            --relation-map work/RELATION_MAP.json \
            --output work/OPERATIONAL_POOL_SELECTION_A.json
          python research/eb_typed_selector_rc0/screen_operational_pool.py \
            --artifact-zip work/pr63.zip \
            --relation-map work/RELATION_MAP.json \
            --output work/OPERATIONAL_POOL_SELECTION_B.json
          cmp work/OPERATIONAL_POOL_SELECTION_A.json work/OPERATIONAL_POOL_SELECTION_B.json
          sha256sum work/OPERATIONAL_POOL_SELECTION_A.json work/OPERATIONAL_POOL_SELECTION_B.json \
            | tee work/OPERATIONAL_POOL_SELECTION_SHA256.txt

      - name: Open frozen operational labels only after selection freeze
        run: |
          set -euo pipefail
          git show eb72be8f936d68cf2cfcb316e401626ea9de5839:research/eb_v1_selector_bakeoff_rc0/OPERATIONAL_LABEL_BINDING.json > work/sealed_eval/OPERATIONAL_LABEL_BINDING.json
          python research/eb_typed_selector_rc0/evaluate_operational_pool.py \
            --selection work/OPERATIONAL_POOL_SELECTION_A.json \
            --binding work/sealed_eval/OPERATIONAL_LABEL_BINDING.json \
            --relation-map work/RELATION_MAP.json \
            --output work/sealed_eval/OPERATIONAL_POOL_EVALUATION.json
          cat work/sealed_eval/OPERATIONAL_POOL_EVALUATION.json

      - name: Preserve receipts
        run: |
          git rev-parse HEAD | tee work/HOSTED_HEAD.txt
          git rev-parse HEAD^{tree} | tee work/HOSTED_TREE.txt
          sha256sum \
            research/eb_typed_selector_rc0/selector.py \
            work/RELATION_MAP.json \
            work/OPERATIONAL_POOL_SELECTION_A.json \
            work/sealed_eval/OPERATIONAL_LABEL_BINDING.json \
            work/sealed_eval/OPERATIONAL_POOL_EVALUATION.json \
            | sort | tee work/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eb-typed-selector-operational-screen-rc0
          path: work/
          if-no-files-found: error
          retention-days: 90
