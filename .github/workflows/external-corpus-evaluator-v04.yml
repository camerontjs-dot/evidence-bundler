name: External Corpus Evaluator v0.4 Research Assurance

on:
  push:
    branches:
      - research-infra/external-corpus-evaluator-contract-v04-clarification-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator-v04:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile frozen research evaluators
        run: |
          python -m py_compile \
            research/external_corpus_evaluator_independence_v3/evaluator_a.py \
            research/external_corpus_evaluator_independence_v3/evaluator_b.py \
            research/external_corpus_evaluator_independence_v3/canonical.py
      - name: Run v0.4 contract tests
        run: python -m pytest -q tests/test_external_corpus_evaluator_independence_v3.py
