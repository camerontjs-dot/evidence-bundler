name: Research - counterevidence pass dev RC1

on:
  push:
    branches:
      - research/retrieval-counterevidence-pass-dev-rc1-20260829
    paths:
      - "research/retrieval_counterevidence_pass_dev_rc1/**"
      - "tests/test_retrieval_counterevidence_pass_dev_rc1.py"
      - ".github/workflows/research-counterevidence-pass-dev-rc1.yml"
  pull_request:
    paths:
      - "research/retrieval_counterevidence_pass_dev_rc1/**"
      - "tests/test_retrieval_counterevidence_pass_dev_rc1.py"
      - ".github/workflows/research-counterevidence-pass-dev-rc1.yml"

permissions:
  contents: read

jobs:
  counterevidence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record exact identity
        run: |
          set -o pipefail
          mkdir -p artifacts/counterevidence-pass-dev-rc1
          git rev-parse HEAD | tee artifacts/counterevidence-pass-dev-rc1/commit-sha.txt
          git rev-parse HEAD^{tree} | tee artifacts/counterevidence-pass-dev-rc1/tree-sha.txt

      - name: Verify frozen identity and gold-blind runner
        run: |
          set -o pipefail
          test "$(sha256sum benchmarks/eb-retrieval-assurance-rc2-v1/SHA256SUMS | cut -d' ' -f1)" = "0a9da82e3e28fd3650936fc715904e39c91f34a944ac7c3bfe40277953870dad"
          ! grep -q "evaluator_only" research/retrieval_counterevidence_pass_dev_rc1/runtime_runner.py
          ! grep -q "dev_gold" research/retrieval_counterevidence_pass_dev_rc1/runtime_runner.py
          ! grep -q "sealed_gold" research/retrieval_counterevidence_pass_dev_rc1/runtime_runner.py

      - name: Install package and dev tools
        run: |
          set -o pipefail
          python -m pip install -e ".[dev]"

      - name: Run full suite
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee artifacts/counterevidence-pass-dev-rc1/pytest.txt

      - name: Run counterevidence boundary test
        run: |
          set -o pipefail
          python -m pytest -q tests/test_retrieval_counterevidence_pass_dev_rc1.py             2>&1 | tee artifacts/counterevidence-pass-dev-rc1/counter-tests.txt

      - name: Ruff apparatus
        run: |
          set -o pipefail
          python -m ruff check             research/retrieval_counterevidence_pass_dev_rc1/runtime_runner.py             research/retrieval_counterevidence_pass_dev_rc1/analyzer.py             tests/test_retrieval_counterevidence_pass_dev_rc1.py             2>&1 | tee artifacts/counterevidence-pass-dev-rc1/ruff.txt

      - name: Generate gold-blind E0 E1 E2 outputs
        run: |
          set -o pipefail
          python -m research.retrieval_counterevidence_pass_dev_rc1.runtime_runner             --runtime-root benchmarks/eb-retrieval-assurance-rc2-v1/runtime             --apparatus-sha "$(git rev-parse HEAD)"             --output artifacts/counterevidence-pass-dev-rc1/raw.json             | tee artifacts/counterevidence-pass-dev-rc1/execution-receipt.json

      - name: Analyze against dev gold
        run: |
          set -o pipefail
          python -m research.retrieval_counterevidence_pass_dev_rc1.analyzer             --runtime-root benchmarks/eb-retrieval-assurance-rc2-v1/runtime             --gold benchmarks/eb-retrieval-assurance-rc2-v1/evaluator_only/dev_gold.jsonl             --raw artifacts/counterevidence-pass-dev-rc1/raw.json             --output artifacts/counterevidence-pass-dev-rc1/analysis.json             | tee artifacts/counterevidence-pass-dev-rc1/analysis-summary.json

      - name: Hash artifacts
        run: |
          set -o pipefail
          cd artifacts/counterevidence-pass-dev-rc1
          sha256sum * | sort > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterevidence-pass-dev-rc1-${{ github.sha }}
          path: artifacts/counterevidence-pass-dev-rc1/
          if-no-files-found: error
          retention-days: 90
