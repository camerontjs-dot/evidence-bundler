name: Research - freeze EB retrieval assurance RC2 v1

on:
  push:
    branches:
      - research-infra/eb-retrieval-assurance-rc2
    paths:
      - '.github/workflows/research-eb-retrieval-assurance-rc2-freeze.yml'

permissions:
  contents: write

jobs:
  freeze-first-sealed-candidate:
    runs-on: ubuntu-latest
    env:
      FROZEN_APPARATUS_COMMIT: 82ec006e888e22c5e5cde600546c05cc6e0b5e33
      APPARATUS_ROOT: research/eb_retrieval_assurance_rc2
      BENCHMARK_ROOT: benchmarks/eb-retrieval-assurance-rc2-v1
      EXPECTED_TREE_SHA256: 0a9da82e3e28fd3650936fc715904e39c91f34a944ac7c3bfe40277953870dad
      EXPECTED_FIRST_CONTROL_SHA256: d3cdc3ac7c356cc4ec0edc06b6d149bc80082e861b078e8ef94a2df9ad8dfb74
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify frozen apparatus bytes remain exact
        shell: bash
        run: |
          set -euo pipefail
          echo 'eccb586d8366ba6f878ffb323315b81251017153a5ef892d407594818cba7086  research/eb_retrieval_assurance_rc2/generate_challenge.py' | sha256sum -c -
          echo '6b73492b724ed4d7bf76114d1f71c26fb66e8ac00f8dfd5d0b3f55cf2109e1fd  research/eb_retrieval_assurance_rc2/validate_challenge.py' | sha256sum -c -
          echo 'c443a64a2c2dfe8c9b0decd8c0414c1e7bb1069d86d3355dd0202fa9725aff08  research/eb_retrieval_assurance_rc2/evaluator.py' | sha256sum -c -
          echo '7735fd74dc46dc0ddb46f031cfb2fa9a24578e3c47b406243811be1cdfbe709d  research/eb_retrieval_assurance_rc2/control_runner.py' | sha256sum -c -
          echo '9df75b448ff5090d9bd2821f624e327d47ba5ea9848460cf69518bb6b04ea05a  research/eb_retrieval_assurance_rc2/thresholds.json' | sha256sum -c -
          echo '26a56b08c90277f6d13434d5bb5db4a0f71edc925ff78db6de285b6a4b992dd0  research/eb_retrieval_assurance_rc2/result.schema.json' | sha256sum -c -
          echo 'aa864c77294d0158b98537170e5262e4369c2e15e420cb1f57199d5a2759ae4a  docs/research/brief-13-eb-retrieval-assurance-rc2.md' | sha256sum -c -

      - name: Regenerate the exact first-sealed candidate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$BENCHMARK_ROOT"
          python "$APPARATUS_ROOT/generate_challenge.py" \
            --output work/candidate --splits all \
            --generator-source-commit "$FROZEN_APPARATUS_COMMIT" \
            > work/freeze-generation.json
          python "$APPARATUS_ROOT/validate_challenge.py" \
            --benchmark-root work/candidate \
            --output work/freeze-validation.json
          observed="$(python -c 'import json; print(json.load(open("work/candidate/freeze_receipt.json"))["tree_sha256"])')"
          test "$observed" = "$EXPECTED_TREE_SHA256"

      - name: Verify every first-run candidate file identity
        shell: bash
        run: |
          set -euo pipefail
          cd work/candidate
          echo '10b71aeca95e62792f499d9f54db253db4162556d414e8d51da353bd38066fa1  manifest.json' | sha256sum -c -
          echo '0a9da82e3e28fd3650936fc715904e39c91f34a944ac7c3bfe40277953870dad  SHA256SUMS' | sha256sum -c -
          echo '527799e8f2914bd290d23e90eedc18e5eccf9f30cadd7a1906a2a05d3143ec18  freeze_receipt.json' | sha256sum -c -
          echo '352ce375a9b2e987f5a7fc686c4560d018646e56a13743027b0b06602cf66dbd  runtime/passages.jsonl' | sha256sum -c -
          echo '9f11111aee7bc9b0b0c798184b09efb0d2502c8463d63fef3ed2d08d598ad236  runtime/apertures.json' | sha256sum -c -
          echo 'cb8018d950b785910937375d6936073405d754f3c7616b7d8cd9d1bebc22d57a  runtime/dev_cases.jsonl' | sha256sum -c -
          echo 'b5f15e7ec52e34846d26e15f530daf242264862ccf56950f5151735c55ce8120  runtime/sealed_cases.jsonl' | sha256sum -c -
          echo 'a0498b6704036a876ffd4c354a7284b8478a76c8b11f89475b674bc3e2ddde28  evaluator_only/dev_gold.jsonl' | sha256sum -c -
          echo '4c114dd2f00e70f26581f0287058ce68ad40ef5b8d28fcaae582a6b4e719915c  evaluator_only/sealed_gold.jsonl' | sha256sum -c -

      - name: Reproduce first sealed control hash without changing apparatus
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$APPARATUS_ROOT" python "$APPARATUS_ROOT/control_runner.py" \
            --benchmark-root work/candidate --split sealed \
            --thresholds "$APPARATUS_ROOT/thresholds.json" \
            --output work/sealed-controls-reproduction.json \
            > work/sealed-controls-reproduction.log
          observed="$(sha256sum work/sealed-controls-reproduction.json | cut -d' ' -f1)"
          test "$observed" = "$EXPECTED_FIRST_CONTROL_SHA256"

      - name: Freeze exact candidate bytes in repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmarks
          cp -a work/candidate "$BENCHMARK_ROOT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$BENCHMARK_ROOT"
          git commit -m 'research: freeze RC2 discriminating sealed challenge v1 [skip ci]'
          git push origin HEAD:research-infra/eb-retrieval-assurance-rc2
