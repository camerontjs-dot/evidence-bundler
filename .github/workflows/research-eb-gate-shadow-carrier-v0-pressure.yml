name: Research - EB Gate Shadow Carrier V0 Pressure

on:
  push:
    branches:
      - research-infra/eb-gate-shadow-carrier-v0-20260917
    paths:
      - research/eb_gate_informed_requirements_v0/SHADOW-CARRIER-LAUNCH.json

permissions:
  contents: write

env:
  RESULT_BRANCH: research/eb-gate-shadow-carrier-v0-pressure-result-20260917
  SURFACE: research/eb_gate_informed_requirements_v0

jobs:
  quality:
    name: Quality Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install research lint dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ruff>=0.15,<1'

      - name: Ruff shadow carrier apparatus
        run: |
          python -m ruff check \
            "$SURFACE/shadow_carrier.py" \
            "$SURFACE/test_shadow_carrier.py" \
            "$SURFACE/pressure_shadow_carrier.py"

      - name: Compile shadow carrier apparatus
        run: |
          python -m py_compile \
            "$SURFACE/shadow_carrier.py" \
            "$SURFACE/test_shadow_carrier.py" \
            "$SURFACE/pressure_shadow_carrier.py"

      - name: Focused unit controls
        working-directory: research/eb_gate_informed_requirements_v0
        run: python test_shadow_carrier.py

  pressure:
    name: Frozen broad carrier pressure
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record exact execution identity
        run: |
          set -euo pipefail
          mkdir -p out
          {
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "python=$(python --version 2>&1)"
          } > out/RUNTIME-IDENTITY.txt

      - name: Re-run unit controls before pressure
        working-directory: research/eb_gate_informed_requirements_v0
        run: python test_shadow_carrier.py

      - name: Execute 92-field carrier pressure
        working-directory: research/eb_gate_informed_requirements_v0
        run: |
          python pressure_shadow_carrier.py \
            --out ../../out/PRESSURE-RESULT.json

      - name: Bind source and result hashes
        run: |
          set -euo pipefail
          sha256sum \
            "$SURFACE/shadow_carrier.py" \
            "$SURFACE/test_shadow_carrier.py" \
            "$SURFACE/pressure_shadow_carrier.py" \
            "$SURFACE/SHADOW-FIELD-REGISTRY.json" \
            out/PRESSURE-RESULT.json \
            > out/SHA256SUMS

      - name: Create apparatus receipt
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          def sha(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          result = json.loads(Path("out/PRESSURE-RESULT.json").read_text())
          assert result["status"] == "SUPPORTED_SHADOW_CARRIER_APPARATUS"
          assert result["registry"]["field_count"] == 92

          receipt = {
              "schema": "eb-gate-shadow-carrier-pressure-receipt-v0",
              "status": "SUPPORTED_SHADOW_CARRIER_APPARATUS",
              "subject_commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "subject_tree": subprocess.check_output(
                  ["git", "rev-parse", "HEAD^{tree}"], text=True
              ).strip(),
              "carrier_sha256": sha(
                  "research/eb_gate_informed_requirements_v0/shadow_carrier.py"
              ),
              "unit_tests_sha256": sha(
                  "research/eb_gate_informed_requirements_v0/test_shadow_carrier.py"
              ),
              "pressure_runner_sha256": sha(
                  "research/eb_gate_informed_requirements_v0/pressure_shadow_carrier.py"
              ),
              "registry_sha256": sha(
                  "research/eb_gate_informed_requirements_v0/SHADOW-FIELD-REGISTRY.json"
              ),
              "pressure_result_sha256": sha("out/PRESSURE-RESULT.json"),
              "total_assertions": result["total_assertions"],
              "field_count": result["registry"]["field_count"],
              "semantic_field_qualification": False,
              "causal_eb_authority": False,
              "retrieval_or_selection_changed": False,
          }
          Path("out/PRESSURE-RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload pressure artifact
        uses: actions/upload-artifact@v4
        with:
          name: eb-gate-shadow-carrier-v0-pressure-${{ github.sha }}
          path: out/
          if-no-files-found: error

      - name: Freeze pressure result on immutable research ref
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/$RESULT_BRANCH" >/dev/null 2>&1; then
            echo "result branch already exists; refusing overwrite"
            exit 1
          fi

          git checkout -b "$RESULT_BRANCH"
          dest="$SURFACE/pressure_result"
          mkdir -p "$dest"
          cp out/PRESSURE-RESULT.json "$dest/"
          cp out/PRESSURE-RECEIPT.json "$dest/"
          cp out/RUNTIME-IDENTITY.txt "$dest/"
          cp out/SHA256SUMS "$dest/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "Research: freeze Gate shadow carrier V0 pressure result"
          git push origin "HEAD:refs/heads/$RESULT_BRANCH"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
