name: Research - machinery audit baseline

on:
  push:
    branches:
      - research/machinery-audit-20260829
  pull_request:
    paths:
      - "research/machinery_audit/**"
      - ".github/workflows/research-machinery-audit.yml"
      - "src/evidence_bundler/**"
      - "tests/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  deterministic-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev tools
        run: python -m pip install -e ".[dev]"
      - name: Full pytest suite
        run: python -m pytest -q
      - name: Record pre-existing repository Ruff debt
        continue-on-error: true
        run: python -m ruff check src tests
      - name: Ruff audit additions
        run: python -m ruff check research/machinery_audit
      - name: Mypy
        run: python -m mypy src
      - name: Existing deterministic retrieval comparison
        run: python scripts/run_phase_2b_unit6_comparison.py

  real-model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Evidence Bundler
        run: python -m pip install -e ".[dev]"
      - name: Run real-model retrieval smoke
        run: |
          mkdir -p artifacts/machinery-audit
          python research/machinery_audit/real_retrieval_smoke.py             | tee artifacts/machinery-audit/real-retrieval-smoke.json
          sha256sum artifacts/machinery-audit/real-retrieval-smoke.json             > artifacts/machinery-audit/real-retrieval-smoke.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-bundler-machinery-audit-${{ github.sha }}
          path: artifacts/machinery-audit/
          if-no-files-found: warn
          retention-days: 30
