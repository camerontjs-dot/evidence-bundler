name: Public root-only generation setup checks
on:
  pull_request:
    paths:
      - 'research/eb_root_only_generation_qualification_rc0_20261002/**'
      - '.github/workflows/research-root-only-generation-setup-rc0.yml'
permissions:
  contents: read
jobs:
  mechanical-setup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate frozen public setup only
        run: python research/eb_root_only_generation_qualification_rc0_20261002/validate_setup.py
      - name: Protected production and predecessor diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff --exit-code "$BASE_REF" HEAD -- src scripts config pyproject.toml research/eb_prospective_authoring_retrieval_rc2_20261002 research/eb_child_subject_retrieval_rc1_20261001
