name: External corpus evaluator independence v2

on:
  pull_request:
    paths:
      - "research/external_corpus_evaluator_independence_v2/**"
      - "tests/test_external_corpus_evaluator_independence_v2.py"
      - "docs/research/decision-external-corpus-evaluator-contract-v03-ndcg-scope.md"
      - ".github/workflows/external-corpus-evaluator-independence-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assurance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "pytest>=8,<10"
      - run: python -m pytest -q tests/test_external_corpus_evaluator_independence_v2.py
