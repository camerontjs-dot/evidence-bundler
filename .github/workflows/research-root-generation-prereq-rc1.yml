name: Public root-generation prerequisite RC1 checks
on:
  pull_request:
    paths:
      - 'research/eb_root_generation_prereq_rc1_20261003/**'
      - '.github/workflows/research-root-generation-prereq-rc1.yml'
permissions:
  contents: read
jobs:
  mechanical-prereq:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate RC1 prerequisite setup only
        run: python research/eb_root_generation_prereq_rc1_20261003/validate_setup.py
      - name: Enforce research-only diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          allowed='^(research/eb_root_generation_prereq_rc1_20261003/|\.github/workflows/research-root-generation-prereq-rc1\.yml$)'
          bad="$(git diff --name-only "$BASE_REF" HEAD | grep -Ev "$allowed" || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
