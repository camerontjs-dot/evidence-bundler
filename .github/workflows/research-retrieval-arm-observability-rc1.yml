name: Research - retrieval arm observability RC1

on:
  pull_request:
    paths:
      - "src/evidence_bundler/**"
      - "tests/**"
      - "research/retrieval_control_surface_rc0/**"
      - ".github/workflows/research-retrieval-arm-observability-rc1.yml"
      - "pyproject.toml"
  push:
    branches:
      - research-infra/retrieval-arm-observability-rc1-20260829
    paths:
      - "src/evidence_bundler/**"
      - "tests/**"
      - "research/retrieval_control_surface_rc0/**"
      - ".github/workflows/research-retrieval-arm-observability-rc1.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apparatus:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record exact apparatus identity
        run: |
          mkdir -p artifacts/retrieval-arm-observability-rc1
          git rev-parse HEAD | tee artifacts/retrieval-arm-observability-rc1/commit-sha.txt
          git rev-parse HEAD^{tree} | tee artifacts/retrieval-arm-observability-rc1/tree-sha.txt
      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Run full deterministic suite
        run: |
          python -m pytest -q 2>&1 | tee artifacts/retrieval-arm-observability-rc1/pytest.txt
      - name: Run successor replay and observability tests explicitly
        run: |
          python -m pytest -q tests/test_retrieval_arm_observability_rc1.py \
            2>&1 | tee artifacts/retrieval-arm-observability-rc1/observability-tests.txt
      - name: Ruff apparatus
        run: |
          python -m ruff check \
            src/evidence_bundler/models/retrieval.py \
            src/evidence_bundler/contracts/writer.py \
            src/evidence_bundler/retrieval/contradiction.py \
            src/evidence_bundler/retrieval/research_receipt.py \
            tests/test_retrieval_control_surface_rc0.py \
            tests/test_retrieval_arm_observability_rc1.py \
            research/retrieval_control_surface_rc0/real_model_smoke.py \
            2>&1 | tee artifacts/retrieval-arm-observability-rc1/ruff.txt
      - name: Mypy apparatus source
        run: |
          python -m mypy \
            src/evidence_bundler/models/retrieval.py \
            src/evidence_bundler/contracts/writer.py \
            src/evidence_bundler/retrieval/contradiction.py \
            src/evidence_bundler/retrieval/research_receipt.py \
            2>&1 | tee artifacts/retrieval-arm-observability-rc1/mypy.txt
      - name: CLI truthfulness
        run: |
          evidence-bundler build-bundle --help | tee artifacts/retrieval-arm-observability-rc1/build-bundle-help.txt
          ! grep -q "not wired" artifacts/retrieval-arm-observability-rc1/build-bundle-help.txt
          grep -q "semantic" artifacts/retrieval-arm-observability-rc1/build-bundle-help.txt
          grep -q "hybrid" artifacts/retrieval-arm-observability-rc1/build-bundle-help.txt
      - name: Exact pinned real-model execution smoke
        run: |
          python research/retrieval_control_surface_rc0/real_model_smoke.py \
            | tee artifacts/retrieval-arm-observability-rc1/real-model-receipt.json
          sha256sum artifacts/retrieval-arm-observability-rc1/real-model-receipt.json \
            > artifacts/retrieval-arm-observability-rc1/real-model-receipt.sha256
      - name: Runtime versions
        run: |
          python - <<'PY' | tee artifacts/retrieval-arm-observability-rc1/runtime-versions.txt
          import platform, sys
          from importlib.metadata import version
          print("python=" + sys.version.split()[0])
          print("platform=" + platform.platform())
          for name in ("evidence-bundler", "sentence-transformers", "faiss-cpu", "rank-bm25", "pydantic"):
              print(f"{name}={version(name)}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-arm-observability-rc1-${{ github.sha }}
          path: artifacts/retrieval-arm-observability-rc1/
          if-no-files-found: error
          retention-days: 90
