name: Research - PR8 frozen benchmark base-head differential

on:
  push:
    branches:
      - research-infra/pr8-frozen-benchmark-reconciliation

permissions:
  contents: read

jobs:
  ordinary-eb-test-differential:
    name: ordinary EB suite (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: exact-base
            ref: c8189c31adbab11729c31430c2070126224a2d42
          - label: frozen-head
            ref: 22b227ec2c34a085efc79267bc007ff78607aeed

    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install identical project + dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Capture dependency/config state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pr8-differential
          python --version | tee artifacts/pr8-differential/python-version.txt
          python -m pip --version | tee artifacts/pr8-differential/pip-version.txt
          python -m pip freeze | sort | tee artifacts/pr8-differential/pip-freeze.txt
          sha256sum pyproject.toml | tee artifacts/pr8-differential/pyproject.sha256
          git rev-parse HEAD | tee artifacts/pr8-differential/observed-head.txt

      - name: Run ordinary EB suite without repairing failures
        id: pytest
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/pr8-differential
          set +e
          python -m pytest -q --junitxml=artifacts/pr8-differential/pytest.xml \
            2>&1 | tee artifacts/pr8-differential/pytest.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" | tee artifacts/pr8-differential/pytest-exit-code.txt
          grep '^FAILED ' artifacts/pr8-differential/pytest.log \
            | sed -E 's/^FAILED ([^ ]+).*/\1/' \
            > artifacts/pr8-differential/failed-nodeids-from-log.txt || true
          exit 0

      - name: Build machine-readable receipt
        env:
          TARGET_LABEL: ${{ matrix.label }}
          TARGET_REF: ${{ matrix.ref }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('artifacts/pr8-differential')
          xml_root = ET.parse(root / 'pytest.xml').getroot()
          suites = [xml_root] if xml_root.tag == 'testsuite' else list(xml_root.findall('testsuite'))
          counts = {key: sum(int(s.attrib.get(key, 0)) for s in suites) for key in ('tests', 'failures', 'errors', 'skipped')}
          failures = []
          for suite in suites:
              for case in suite.findall('testcase'):
                  if case.find('failure') is not None or case.find('error') is not None:
                      classname = case.attrib.get('classname', '')
                      name = case.attrib.get('name', '')
                      failures.append(f'{classname}::{name}' if classname else name)
          freeze = (root / 'pip-freeze.txt').read_bytes()
          pyproject = Path('pyproject.toml').read_bytes()
          receipt = {
              'schema_version': '1.0',
              'assay': 'ordinary-eb-base-head-differential',
              'target_label': os.environ['TARGET_LABEL'],
              'target_ref': os.environ['TARGET_REF'],
              'observed_git_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'python': platform.python_version(),
              'platform': platform.platform(),
              'pyproject_sha256': hashlib.sha256(pyproject).hexdigest(),
              'pip_freeze_sha256': hashlib.sha256(freeze).hexdigest(),
              'pytest_exit_code': int((root / 'pytest-exit-code.txt').read_text().strip()),
              'pytest_counts': counts,
              'failing_tests': sorted(failures),
          }
          (root / 'receipt.json').write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload differential receipt
        uses: actions/upload-artifact@v4
        with:
          name: pr8-base-head-differential-${{ matrix.label }}-${{ matrix.ref }}
          path: artifacts/pr8-differential/
          if-no-files-found: error
          retention-days: 90
