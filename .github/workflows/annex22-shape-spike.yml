name: Annex 22 shape spike

on:
  push:
    branches:
      - annex22-bundle-shape-spike
  pull_request:
    branches:
      - main

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install probe dependencies
        run: python -m pip install "PyYAML>=6,<7" "pytest>=8,<10" "ruff>=0.15,<1"
      - name: Targeted shape tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_annex22_shape_probe.py
      - name: Lint probe
        run: python -m ruff check src/evidence_bundler/experiments tests/test_annex22_shape_probe.py
