name: Research - EB retrieval evaluator assurance RC1

on:
  push:
    branches:
      - research-infra/eb-retrieval-evaluator-rc1
  pull_request:
    branches:
      - feat/add-eb-challenge-corpus-v1
    paths:
      - 'research/eb_retrieval_evaluator_rc1/**'
      - 'docs/research/brief-07-eb-retrieval-evaluator-assurance-rc1.md'
      - 'docs/research/deviation-07a-eb-retrieval-evaluator-gold-summary-semantics.md'
      - 'benchmarks/eb-challenge-corpus-v1/**'
      - '.github/workflows/research-eb-retrieval-evaluator-rc1.yml'

permissions:
  contents: read

jobs:
  evaluator-assurance:
    runs-on: ubuntu-latest
    env:
      EVALUATOR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify frozen transform apparatus is present
        shell: bash
        run: |
          set -euo pipefail
          test -f benchmarks/eb-challenge-corpus-v1/transforms/views/transform-source-enumeration-permutation-v1/view_manifest.json
          test -f benchmarks/eb-challenge-corpus-v1/transforms/views/transform-harmless-metadata-order-permutation-v1/view_manifest.json
          test -f benchmarks/eb-challenge-corpus-v1/transforms/views/transform-duplicate-document-insertion-v1/view_manifest.json
          test -f benchmarks/eb-challenge-corpus-v1/transforms/views/transform-paraphrased-duplicate-insertion-v1/view_manifest.json
          test -f benchmarks/eb-challenge-corpus-v1/transforms/views/transform-paragraph-order-permutation-v1/semantic_anchor_mapping.json

      - name: Diagnose frozen gold summary semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/eb-retrieval-evaluator-rc1/sources
          cp research/eb_retrieval_evaluator_rc1/evaluator.py artifacts/eb-retrieval-evaluator-rc1/sources/evaluator.py
          cp research/eb_retrieval_evaluator_rc1/corrected_runner.py artifacts/eb-retrieval-evaluator-rc1/sources/corrected_runner.py
          cp research/eb_retrieval_evaluator_rc1/retrieval_result.schema.json artifacts/eb-retrieval-evaluator-rc1/sources/retrieval_result.schema.json
          cp research/eb_retrieval_evaluator_rc1/diagnose_gold_semantics.py artifacts/eb-retrieval-evaluator-rc1/sources/diagnose_gold_semantics.py
          cp docs/research/brief-07-eb-retrieval-evaluator-assurance-rc1.md artifacts/eb-retrieval-evaluator-rc1/sources/preregistration.md
          cp docs/research/deviation-07a-eb-retrieval-evaluator-gold-summary-semantics.md artifacts/eb-retrieval-evaluator-rc1/sources/deviation-07a.md
          python research/eb_retrieval_evaluator_rc1/diagnose_gold_semantics.py \
            --benchmark-root benchmarks/eb-challenge-corpus-v1 \
            --output artifacts/eb-retrieval-evaluator-rc1/gold-semantics-diagnostic.json \
            | tee artifacts/eb-retrieval-evaluator-rc1/gold-semantics-diagnostic.log
          sha256sum artifacts/eb-retrieval-evaluator-rc1/gold-semantics-diagnostic.json \
            | tee artifacts/eb-retrieval-evaluator-rc1/gold-semantics-diagnostic.sha256

      - name: Run preregistered evaluator controls
        id: assurance
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/eb-retrieval-evaluator-rc1
          set +e
          python research/eb_retrieval_evaluator_rc1/corrected_runner.py \
            --benchmark-root benchmarks/eb-challenge-corpus-v1 \
            --output artifacts/eb-retrieval-evaluator-rc1/assurance.json \
            2>&1 | tee artifacts/eb-retrieval-evaluator-rc1/evaluator.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ -f artifacts/eb-retrieval-evaluator-rc1/assurance.json ]]; then
            sha256sum artifacts/eb-retrieval-evaluator-rc1/assurance.json \
              | tee artifacts/eb-retrieval-evaluator-rc1/assurance.sha256
          fi
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import sys
          from pathlib import Path

          evaluator = Path('research/eb_retrieval_evaluator_rc1/evaluator.py')
          correction = Path('research/eb_retrieval_evaluator_rc1/corrected_runner.py')
          schema = Path('research/eb_retrieval_evaluator_rc1/retrieval_result.schema.json')
          prereg = Path('docs/research/brief-07-eb-retrieval-evaluator-assurance-rc1.md')
          diagnostic = Path('research/eb_retrieval_evaluator_rc1/diagnose_gold_semantics.py')
          deviation = Path('docs/research/deviation-07a-eb-retrieval-evaluator-gold-summary-semantics.md')
          output = Path('artifacts/eb-retrieval-evaluator-rc1/run_receipt.json')

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          receipt = {
              'schema_version': '1.0',
              'evaluator_head_sha': os.environ.get('EVALUATOR_HEAD_SHA'),
              'github_sha_observed_by_workflow': os.environ.get('GITHUB_SHA'),
              'github_ref': os.environ.get('GITHUB_REF'),
              'github_run_id': os.environ.get('GITHUB_RUN_ID'),
              'python': sys.version,
              'platform': platform.platform(),
              'evaluator_source_sha256': digest(evaluator),
              'correction_source_sha256': digest(correction),
              'evaluator_composite_source_sha256': hashlib.sha256(
                  evaluator.read_bytes() + b'\0' + correction.read_bytes()
              ).hexdigest(),
              'result_schema_sha256': digest(schema),
              'preregistration_sha256': digest(prereg),
              'gold_diagnostic_source_sha256': digest(diagnostic),
              'deviation_record_sha256': digest(deviation),
          }
          output.write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt, sort_keys=True))
          PY
          echo "evaluator_exit_code=$status" | tee artifacts/eb-retrieval-evaluator-rc1/evaluator_exit_code.txt
          exit "$status"

      - name: Upload evaluator assurance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eb-retrieval-evaluator-assurance-rc1-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/eb-retrieval-evaluator-rc1/
          if-no-files-found: error
          retention-days: 90
