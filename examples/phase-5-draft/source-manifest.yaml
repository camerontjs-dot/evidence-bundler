# Phase 5 FDA Guidance Source Manifest
#
# This manifest defines the real-corpus sources for the Phase 5 demo.
# The demo runner downloads these PDFs, verifies their sha256 checksums,
# and constructs the full C-A scaffold under build/phase-5-fda-guidance-demo/.
#
# PDFs are NOT committed to the repository. Only this manifest is committed.
# Checksums are populated after first verified download and pinned for
# reproducibility. A checksum mismatch (FDA re-publishes the PDF) requires
# a deliberate manifest update with a new retrieval_date.

schema_version: "1.0.0"

sources:
  - source_id: "src-cgmp-quality-systems"
    bibliographic:
      source_type: "regulatory_guidance"
      title: "Quality Systems Approach to Pharmaceutical Current Good Manufacturing Practice Regulations"
      authors:
        - "U.S. Food and Drug Administration"
      publication_date: "2006-09-01"
      url: "https://www.fda.gov/files/drugs/published/Quality-Systems-Approach-to-Pharmaceutical-Current-Good-Manufacturing-Practice-Regulations.pdf"
      pmid: null
      doi: null
    trust_level: "primary"
    retrieval_date: "2026-05-13"
    expected_sha256: "69fa9da511ea1d5b59f780700a3ee2c5e949e9add538781cdf1aaaa7d613a32a"
    notes: "Primary FDA CGMP quality systems guidance. Covers QMS framework, CAPA, process validation, change control, supplier management, and equipment qualification. Most claims in the fictional draft note are expected to retrieve against this source."
    retrieved_for:
      - "clm-qms-coverage"
      - "clm-validation-exemption"
      - "clm-apr-scope"
      - "clm-capa-risk"
      - "clm-equipment-requalification"
      - "clm-supplier-qualification"
      - "clm-stability-extension"

