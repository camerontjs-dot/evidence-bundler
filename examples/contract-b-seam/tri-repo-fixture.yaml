fixture_schema: contract-b-seam-shadow-v1
status: research_only
prototype_only: true

bundle:
  bundle_id: seam-shadow-001
  purpose: current_state_validation_audit
  created_at_utc: "2026-08-27T01:15:00Z"
  claim_id: clm-current-validation

claim:
  claim_id: clm-current-validation
  claim_text: "The currently deployed v2 model is adequately validated for release under the audited policy."
  claim_form: assertion
  atomicity: composite
  origin:
    kind: external

required_mechanical_fact_ids:
  - fact-old-validation-version
  - fact-old-validation-date
  - fact-incident-version
  - fact-incident-date
  - fact-supplier-identity
  - fact-supplier-qualification-status
  - fact-current-validation-version
  - fact-current-validation-date
  - fact-current-validation-status

sources:
  - source_id: src-validation-old
    title: "Validation report v1"
    source_type: validation_report
    content_hash: sha256:old-validation
    source_trust_level: primary
    context_facts:
      - fact_id: fact-old-validation-version
        predicate: system_version
        value: "1.0"
        assertion_mode: source_declared
        provenance: {passage_id: psg-validation-old}
      - fact_id: fact-old-validation-date
        predicate: validation_date
        value: "2026-01-10"
        assertion_mode: source_declared
        provenance: {passage_id: psg-validation-old}

  - source_id: src-incident
    title: "Post-change incident record"
    source_type: incident_record
    content_hash: sha256:incident
    source_trust_level: primary
    context_facts:
      - fact_id: fact-incident-version
        predicate: system_version
        value: "2.0"
        assertion_mode: source_declared
        provenance: {passage_id: psg-incident}
      - fact_id: fact-incident-date
        predicate: incident_date
        value: "2026-06-15"
        assertion_mode: source_declared
        provenance: {passage_id: psg-incident}

  - source_id: src-supplier-qualification
    title: "Supplier qualification record"
    source_type: supplier_record
    content_hash: sha256:supplier
    source_trust_level: primary
    context_facts:
      - fact_id: fact-supplier-identity
        predicate: supplier_identity
        value: "Acme Models Ltd"
        assertion_mode: source_declared
        provenance: {passage_id: psg-supplier}
      - fact_id: fact-supplier-qualification-status
        predicate: supplier_qualification_status
        value: qualified
        assertion_mode: source_declared
        provenance: {passage_id: psg-supplier}

  - source_id: src-validation-current
    title: "Current-state validation report v2"
    source_type: validation_report
    content_hash: sha256:current-validation
    source_trust_level: primary
    context_facts:
      - fact_id: fact-current-validation-version
        predicate: system_version
        value: "2.0"
        assertion_mode: source_declared
        provenance: {passage_id: psg-validation-current}
      - fact_id: fact-current-validation-date
        predicate: validation_date
        value: "2026-07-01"
        assertion_mode: source_declared
        provenance: {passage_id: psg-validation-current}
      - fact_id: fact-current-validation-status
        predicate: validation_status
        value: passed
        assertion_mode: source_declared
        provenance: {passage_id: psg-validation-current}

  - source_id: src-marketing
    title: "Product marketing page"
    source_type: marketing_material
    content_hash: sha256:marketing
    source_trust_level: secondary
    context_facts: []

passages:
  - passage_id: psg-validation-old
    source_id: src-validation-old
    text: "The v1 model completed the recorded validation protocol on 2026-01-10."
    passage_hash: sha256:psg-old
    anchors: [{type: section, value: validation-summary}]

  - passage_id: psg-incident
    source_id: src-incident
    text: "An incident was recorded for deployed model version 2.0 on 2026-06-15."
    passage_hash: sha256:psg-incident
    anchors: [{type: record_id, value: INC-204}]

  - passage_id: psg-supplier
    source_id: src-supplier-qualification
    text: "Acme Models Ltd is recorded as qualified in the supplier record."
    passage_hash: sha256:psg-supplier
    anchors: [{type: record_id, value: SUP-17}]

  - passage_id: psg-validation-current
    source_id: src-validation-current
    text: "Model version 2.0 passed the current-state validation protocol on 2026-07-01."
    passage_hash: sha256:psg-current
    anchors: [{type: section, value: approval-summary}]

  - passage_id: psg-marketing
    source_id: src-marketing
    text: "The product is fully validated and enterprise ready."
    passage_hash: sha256:psg-marketing
    anchors: [{type: heading, value: Overview}]

