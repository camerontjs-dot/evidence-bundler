  reviewed_count: 5
  admitted_count: 4
  outcome: admitted
  limitations:
    - "Fixture scope is synthetic and does not establish real-world retrieval completeness."

# CAL-only research state. This block is deliberately downstream of the proposed
# EB/Contract-B seam. Tests mutate it to prove the minimal handoff is invariant.
cal_research_sidecar:
  assessments:
    - passage_id: psg-validation-old
      proposition_specific_relation: support
      semantic_validity: valid
      temporal_applicability: stale_for_current_state
      authority_applicability: applicable
      decision_participation: false

    - passage_id: psg-incident
      proposition_specific_relation: refute
      semantic_validity: valid
      temporal_applicability: historical_relevant
      authority_applicability: applicable
      decision_participation: false

    - passage_id: psg-supplier
      proposition_specific_relation: conditional
      semantic_validity: valid
      temporal_applicability: current
      authority_applicability: applicable
      decision_participation: true

    - passage_id: psg-validation-current
      proposition_specific_relation: support
      semantic_validity: valid
      temporal_applicability: current
      authority_applicability: applicable
      decision_participation: true

  aperture_assessment:
    completeness_conclusion: sufficient_for_fixture_only

  verdict: supported_for_fixture_only
