coverage:
  claim_id: clm-current-validation
  search_scope:
    source_ids:
      - src-validation-old
      - src-incident
      - src-supplier-qualification
      - src-validation-current
      - src-marketing
    closed_world: true
    source_selection_basis: supplied_fixture
